<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Homepage</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1d1d1f;
        }

        .hero {
            text-align: center;
            max-width: 800px;
            padding: 40px;
        }

        h1 {
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #111;
        }

        p {
            font-size: 20px;
            color: #333;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background-color: #0071e3;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #005bb5;
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Welcome to the Homepage</h1>
        <p>Experience the sleek, modern interface designed to give you insights at a glance. Navigate through our prediction tool and explore student exam performance seamlessly.</p>
        <a href="{{ url_for('prediction_page') }}" class="btn">Go to Prediction Tool</a>
    </div>
</body>
</html>
